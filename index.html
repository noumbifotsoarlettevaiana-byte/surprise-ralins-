<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ralins & Vaïana ✨ Besties Forever</title>
  <!-- Canvas-Confetti pour les effets spéciaux -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(-45deg, #13091e, #2a0845, #4a1259, #6b1156);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      padding: 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    /* Badge d'amitié avec effet néon */
    .friend-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(255, 105, 180, 0.15);
      border: 1px solid rgba(255, 182, 193, 0.4);
      border-radius: 50px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffb6c1;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.4rem;
      background: linear-gradient(45deg, #ff9a9e, #fecfef, #f6d365);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 154, 158, 0.3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e2d9f3;
      margin-bottom: 2rem;
    }

    /* Boîte du Compteur d'Amitié */
    .timer-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 1.5rem 1rem;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 182, 193, 0.25);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.05);
      margin-bottom: 2rem;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 1rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.3s ease;
    }

    .time-box:hover {
      transform: scale(1.05);
    }

    .time-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f6d365;
      text-shadow: 0 0 8px rgba(246, 211, 101, 0.5);
    }

    .time-label {
      font-size: 0.7rem;
      color: #d1c4e9;
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Grille des Cartes */
    .section-title {
      font-size: 1.25rem;
      margin-bottom: 1.2rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .surprises-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .surprise-card {
      background: rgba(255, 255, 255, 0.07);
      padding: 1.5rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      position: relative;
      overflow: hidden;
    }

    .surprise-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s ease;
    }

    .surprise-card:hover {
      transform: translateY(-5px) scale(1.02);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 182, 193, 0.5);
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.25);
    }

    .surprise-card:hover::before {
      transform: scale(1);
    }

    .surprise-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }

    .surprise-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f3e5f5;
    }

    /* Modal Pop-Up */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 20, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(135deg, #2a0845, #13091e);
      padding: 1.8rem 1.5rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 182, 193, 0.3);
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-height: 88vh;
      overflow-y: auto;
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 16px;
      margin: 12px 0;
      border: 1px solid rgba(255, 182, 193, 0.3);
      display: none;
    }

    .modal-text {
      font-size: 1rem;
      line-height: 1.6;
      color: #f3e5f5;
      margin: 1.2rem 0;
      font-style: italic;
    }

    .close-btn {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #2a0845;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
      transition: transform 0.2s;
    }

    .close-btn:active {
      transform: scale(0.95);
    }

    /* Étoiles scintillantes */
    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }
  </style>
</head>
<body>

  <!-- Animation des étoiles -->
  <script>
    for (let i = 0; i < 40; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 1 + 'px';
      star.style.height = star.style.width;
      star.style.top = Math.random() * 100 + 'vh';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.backgroundColor = Math.random() > 0.5 ? '#ffb6c1' : '#f6d365';
      document.body.appendChild(star);
    }
  </script>

  <div class="container">
    <div class="friend-badge">💖 Sœur de Cœur 💖</div>
    <h1>Ralins & Vaïana</h1>
    <p class="subtitle">Parce que les meilleures amitiés n'ont pas de prix ✨</p>

    <!-- Carte du Compteur d'Amitié -->
    <div class="timer-card">
      <p style="font-size: 0.9rem; color: #ffb6c1;">Complices et inséparables depuis nos débuts 👭</p>
      <div class="timer-grid">
        <div class="time-box">
          <div class="time-value" id="days">0</div>
          <div class="time-label">Jours</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="hours">0</div>
          <div class="time-label">Heures</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="minutes">0</div>
          <div class="time-label">Min</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="seconds">0</div>
          <div class="time-label">Sec</div>
        </div>
      </div>
    </div>

    <!-- Galerie de Pensées -->
    <h2 class="section-title">Clique pour débloquer tes cartes 🎁</h2>
    <div class="surprises-grid">
      
      <!-- Carte 1 -->
      <div class="surprise-card" onclick="openModal('À ma Bestie Ralins 👑', 'Ralins Aubright, tu es bien plus qu\'une amie, tu es une véritable sœur pour moi. Merci d\'être toujours là avec ton énergie, ton soutien et tes rires !', 'ralins1.jpg')">
        <div class="surprise-icon">👑</div>
        <div class="surprise-text">À ma Bestie</div>
      </div>

      <!-- Carte 2 -->
      <div class="surprise-card" onclick="openModal('Nos Fous Rires 🤣', 'Entre nos discussions interminables, nos secrets partagés et nos délires que nous seules pouvons comprendre... On forme le meilleur duo !', 'ralins2.jpg')">
        <div class="surprise-icon">🥂</div>
        <div class="surprise-text">Nos Fous Rires</div>
      </div>

      <!-- Carte 3 -->
      <div class="surprise-card" onclick="openModal('Pass VIP : Soirée Girls Only 🎟️', 'Ce ticket te donne droit à une soirée 100% détente entre filles : potins, soins, bons petits plats et rigolades à volonté !', '')">
        <div class="surprise-icon">🎟️</div>
        <div class="surprise-text">Pass VIP Girls</div>
      </div>

      <!-- Carte 4 -->
      <div class="surprise-card" onclick="openModal('Une Promesse d\'Avenir 🌟', 'Peu importe où la vie nous mène et à quel point nos journées sont chargées, sache que je serai toujours là pour toi, quoi qu\'il arrive !', '')">
        <div class="surprise-icon">🌟</div>
        <div class="surprise-text">Une Promesse</div>
      </div>

    </div>
  </div>

  <!-- Pop-up Modal -->
  <div class="modal" id="myModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="color: #ff9a9e; font-size: 1.3rem;">Titre</h3>
      <img id="modalImage" class="modal-img" src="" alt="Souvenir avec Ralins">
      <p class="modal-text" id="modalText">Texte du message...</p>
      <button class="close-btn" onclick="closeModal()">Fermer 💕</button>
    </div>
  </div>

  <script>
    // --- COMPTEUR TEMPS RÉEL DE L'AMITIÉ ---
    // Tu peux ajuster la date exacte si tu le souhaites (Année-Mois-Jour)
    const startDate = new Date("2024-01-01T00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = now - startDate;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
      }
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // --- LOGIQUE POP-UP & EFFET SPÉCIAL CONFETTIS ---
    function openModal(title, text, imageUrl) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalText").innerText = text;
      
      const imgElement = document.getElementById("modalImage");
      if (imageUrl && imageUrl.trim() !== '') {
        imgElement.src = imageUrl;
        imgElement.style.display = "block";
      } else {
        imgElement.style.display = "none";
      }

      document.getElementById("myModal").style.display = "flex";

      // Effet Spécial : Pluie de Confettis Roses et Dorés
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff9a9e', '#fecfef', '#f6d365', '#ffffff']
      });
    }

    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }
  </script>

</body>
    </html>
